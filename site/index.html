<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ANALOG GAP</title>
    <!-- Tema ilk boyamadan önce (titreme yok); mantık src/theme.js ile aynı, anahtar "ag-theme". -->
    <script>try { var p = localStorage.getItem("ag-theme"); document.documentElement.dataset.theme = p === "light" || p === "dark" ? p : (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"); } catch (e) { document.documentElement.dataset.theme = "light"; }</script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
